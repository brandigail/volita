<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1110" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        var t = localStorage.getItem('volita-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <title>Volita: say the job, Volita writes it</title>
    <meta name="description" content="Volita turns what you say into finished quotes, WhatsApps and emails in your name. Made for plumbers, electricians, builders and small businesses. Try Pro free for 14 days, no card." />
    <meta property="og:title" content="Volita: say the job, Volita writes it" />
    <meta property="og:description" content="Quotes, messages and emails written from one spoken sentence, plus a hands-free assistant. Free for 14 days, no card needed." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
