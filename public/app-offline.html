<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1110" />
    <title>Volita is offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 0 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #f2efe6;
        background: radial-gradient(60% 40% at 20% 10%, rgb(232 154 12 / 0.45), transparent 70%), #0a1110;
      }
      .mark {
        display: flex;
        width: 4.5rem;
        height: 4.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #17a090, #e89a0c 55%, #f2693f);
        box-shadow: 0 20px 50px -14px rgb(247 179 43 / 0.8);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 22rem;
        margin: 0;
        color: #a3b3ad;
        line-height: 1.5;
      }
      .retry {
        display: inline-block;
        text-decoration: none;
        margin-top: 0.5rem;
        padding: 0.8rem 1.6rem;
        border: 0;
        border-radius: 0.9rem;
        font: inherit;
        font-weight: 650;
        color: #fff;
        background: linear-gradient(135deg, #17a090, #e89a0c 55%, #f2693f);
        box-shadow: 0 12px 30px -10px rgb(247 179 43 / 0.9);
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 512 512" width="48" height="48" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round">
        <rect x="200" y="96" width="112" height="204" rx="56" fill="#fff" stroke="none" />
        <path d="M148 252a108 108 0 0 0 216 0M256 360v56M200 416h112" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Volita needs the internet to listen, write and talk back. Check your connection, then try again.</p>
    <a class="retry" href="https://volita.netlify.app/">Try again</a>
  </body>
</html>
